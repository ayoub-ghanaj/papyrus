name: Build and package

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check release version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/check-release.py --tag "$REF_NAME"
          else
            python scripts/check-release.py
          fi
      - name: Install Linux packaging and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb libgtk-3-0
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX checksum mismatch' }
          Expand-Archive $zip $tools
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: sh mvnw -B -ntp clean verify
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Exercise desktop UI (Linux)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' java --enable-native-access=ALL-UNNAMED -Dpapyrus.smoke.skipWindowManager=true -cp 'target/test-classes:target/classes:target/lib/*' papyrus.UiSmoke
          xvfb-run -a -s '-screen 0 1920x1080x24' java --enable-native-access=ALL-UNNAMED -Dpapyrus.smoke.skipWindowManager=true -cp 'target/test-classes:target/classes:target/lib/*' papyrus.UiReliabilitySmoke
      - name: Build installers and portable downloads
        run: python scripts/package.py --skip-build
      - name: Verify native installation and upgrade
        run: python scripts/installer-smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papyrus-${{ runner.os }}-x64
          path: dist/*
          if-no-files-found: error
      - name: Download and verify packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: papyrus-${{ runner.os }}-x64
          path: target/download-verification
      - name: Verify downloaded checksums
        run: python scripts/verify-downloads.py target/download-verification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: desktop-screenshots
          path: target/screenshots/*

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: papyrus-*
          path: release-assets
          merge-multiple: true
      - name: Prepare a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release.py --tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to create or replace it."
            exit 1
          fi
          python scripts/verify-downloads.py release-assets
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Papyrus $RELEASE_TAG" --notes-file RELEASE_NOTES.md
